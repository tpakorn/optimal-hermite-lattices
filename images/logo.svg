<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f51b5"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- Grid lines (faint) -->
  <g stroke="#3f51b5" stroke-opacity="0.12" stroke-width="0.5">
    <!-- Vertical -->
    <line x1="40" y1="30" x2="40" y2="170"/>
    <line x1="70" y1="30" x2="70" y2="170"/>
    <line x1="100" y1="30" x2="100" y2="170"/>
    <line x1="130" y1="30" x2="130" y2="170"/>
    <line x1="160" y1="30" x2="160" y2="170"/>
    <!-- Horizontal -->
    <line x1="30" y1="40" x2="170" y2="40"/>
    <line x1="30" y1="70" x2="170" y2="70"/>
    <line x1="30" y1="100" x2="170" y2="100"/>
    <line x1="30" y1="130" x2="170" y2="130"/>
    <line x1="30" y1="160" x2="170" y2="160"/>
  </g>

  <!-- Velocity arrows from center (D2Q9 pattern) -->
  <g stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.35" marker-end="url(#arrowhead)">
    <!-- Cardinal directions -->
    <line x1="100" y1="100" x2="100" y2="42"/>
    <line x1="100" y1="100" x2="158" y2="100"/>
    <line x1="100" y1="100" x2="100" y2="158"/>
    <line x1="100" y1="100" x2="42" y2="100"/>
    <!-- Diagonal directions -->
    <line x1="100" y1="100" x2="141" y2="59"/>
    <line x1="100" y1="100" x2="141" y2="141"/>
    <line x1="100" y1="100" x2="59" y2="141"/>
    <line x1="100" y1="100" x2="59" y2="59"/>
  </g>

  <!-- D2Q9 lattice nodes: layer 0 (center) -->
  <circle cx="100" cy="100" r="7" fill="url(#accent)"/>

  <!-- Layer 1: cardinal (0,1) (1,0) etc -->
  <circle cx="100" cy="40" r="5" fill="#3f51b5"/>
  <circle cx="160" cy="100" r="5" fill="#3f51b5"/>
  <circle cx="100" cy="160" r="5" fill="#3f51b5"/>
  <circle cx="40" cy="100" r="5" fill="#3f51b5"/>

  <!-- Layer 1: diagonal (1,1) etc -->
  <circle cx="160" cy="40" r="4" fill="#7c4dff"/>
  <circle cx="160" cy="160" r="4" fill="#7c4dff"/>
  <circle cx="40" cy="160" r="4" fill="#7c4dff"/>
  <circle cx="40" cy="40" r="4" fill="#7c4dff"/>

  <!-- Outer layer hints (layer 2, faint) -->
  <g fill="#3f51b5" fill-opacity="0.25">
    <circle cx="100" cy="10" r="2.5"/>
    <circle cx="190" cy="100" r="2.5"/>
    <circle cx="100" cy="190" r="2.5"/>
    <circle cx="10" cy="100" r="2.5"/>
    <circle cx="160" cy="10" r="2"/>
    <circle cx="190" cy="40" r="2"/>
    <circle cx="190" cy="160" r="2"/>
    <circle cx="160" cy="190" r="2"/>
    <circle cx="40" cy="190" r="2"/>
    <circle cx="10" cy="160" r="2"/>
    <circle cx="10" cy="40" r="2"/>
    <circle cx="40" cy="10" r="2"/>
  </g>

  <!-- Gaussian envelope ring -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#7c4dff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#3f51b5" stroke-width="0.7" stroke-opacity="0.1" stroke-dasharray="2 4"/>
</svg>
